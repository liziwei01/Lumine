name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS app
        run: xcodebuild -project Lumine.xcodeproj -scheme Lumine -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO 'ARCHS=arm64 x86_64' build
      - name: Package macOS universal app
        run: |
          codesign --force --sign - --timestamp=none build/Build/Products/Release/Lumine.app
          codesign --verify --deep --strict build/Build/Products/Release/Lumine.app
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Release/Lumine.app dist/Lumine-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Lumine-macOS-universal
          path: dist/Lumine-macOS-universal.zip
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check counter calculations
        run: dotnet run --project windows/Lumine.Core.Tests -c Release
      - name: Publish portable Windows x64 app
        run: dotnet publish windows/Lumine.Windows -c Release -r win-x64 --self-contained true -o dist/windows-x64
      - name: Sample Windows metrics and render WPF window
        timeout-minutes: 3
        shell: pwsh
        run: |
          $process = Start-Process dist/windows-x64/Lumine.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Get-Content lumine-smoke-error.txt -ErrorAction SilentlyContinue
            throw "Windows smoke test failed: $($process.ExitCode)"
          }
      - name: Publish portable Windows ARM64 app
        run: dotnet publish windows/Lumine.Windows -c Release -r win-arm64 --self-contained true -o dist/windows-arm64
      - name: Package Windows builds with runtime notices
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -PublishPath dist/windows-x64 -ArchivePath dist/Lumine-Windows-x64.zip
          ./scripts/package-windows.ps1 -PublishPath dist/windows-arm64 -ArchivePath dist/Lumine-Windows-ARM64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Lumine-windows-x64
          path: dist/Lumine-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Lumine-windows-arm64
          path: dist/Lumine-Windows-ARM64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-smoke-evidence
          path: |
            lumine-windows.png
            lumine-smoke.json
            lumine-smoke-error.txt
          if-no-files-found: warn
        if: always()
